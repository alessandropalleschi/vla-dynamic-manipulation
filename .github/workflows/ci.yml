name: ci
# DISABLED for now: runs only when started by hand (Actions tab -> ci -> Run workflow), not on push / pull_request.
# To re-enable: restore the `push:` and `pull_request:` triggers below. For a local runner, also change the job's
# `runs-on` to `self-hosted` (keep `lfs: true` there, or fetch only the needed meshes to limit LFS bandwidth).
on:
  workflow_dispatch:
#  push:
#  pull_request:
jobs:
  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }  # meshes are stored in Git LFS
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files   # large files, committed artifacts, ruff
      - run: pytest
