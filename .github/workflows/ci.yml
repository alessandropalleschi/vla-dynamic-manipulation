name: ci
on:
  push:
  pull_request:
jobs:
  mujoco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }  # meshes are stored in Git LFS
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pre-commit run --all-files   # large files, committed artifacts, ruff
      - run: pytest
