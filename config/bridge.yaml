# ros_gz_bridge mapping. Commands are ROS -> Gazebo; sensors are Gazebo -> ROS.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /conveyor/speed
  gz_topic_name: /conveyor/speed
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gantry/x_cmd
  gz_topic_name: /gantry/x_cmd
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gantry/y_cmd
  gz_topic_name: /gantry/y_cmd
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gantry/z_cmd
  gz_topic_name: /gantry/z_cmd
  ros_type_name: std_msgs/msg/Float64
  gz_type_name: gz.msgs.Double
  direction: ROS_TO_GZ
- ros_topic_name: /gripper/attach
  gz_topic_name: /gripper/attach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ
- ros_topic_name: /gripper/detach
  gz_topic_name: /gripper/detach
  ros_type_name: std_msgs/msg/Empty
  gz_type_name: gz.msgs.Empty
  direction: ROS_TO_GZ
- ros_topic_name: /joint_states
  gz_topic_name: /gantry/joint_state
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /gripper/attached_state
  gz_topic_name: /gripper/attached_state
  ros_type_name: std_msgs/msg/String
  gz_type_name: gz.msgs.StringMsg
  direction: GZ_TO_ROS
# Privileged simulation ground truth. Never feed these topics to the VLA at deployment.
- ros_topic_name: /simulation/lower_box/pose
  gz_topic_name: /simulation/lower_box/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS
- ros_topic_name: /simulation/upper_box/pose
  gz_topic_name: /simulation/upper_box/pose
  ros_type_name: geometry_msgs/msg/PoseStamped
  gz_type_name: gz.msgs.Pose
  direction: GZ_TO_ROS
